services:
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_PID: "Developer"
      MSSQL_SA_PASSWORD: ${MSSQL_SA_PASSWORD:?Configure MSSQL_SA_PASSWORD no arquivo .env}
    ports:
      - "1433:1433"
    volumes:
      - sqlserver-data:/var/opt/mssql
    healthcheck:
      test: ["CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P \"$$MSSQL_SA_PASSWORD\" -C -Q 'SELECT 1' >/dev/null 2>&1"]
      interval: 10s
      timeout: 5s
      retries: 25
      start_period: 25s
  sqlserver-init:
    image: mcr.microsoft.com/mssql/server:2022-latest
    depends_on:
      sqlserver:
        condition: service_healthy
    environment:
      MSSQL_SA_PASSWORD: ${MSSQL_SA_PASSWORD:?Configure a senha no .env}
    entrypoint: ["/bin/bash", "-c"]
    command:
      - >
        /opt/mssql-tools18/bin/sqlcmd -S sqlserver -U sa -P "$$MSSQL_SA_PASSWORD" -C
        -Q "IF DB_ID('cidadao_ativo') IS NULL CREATE DATABASE cidadao_ativo"
  api:
    build: .
    depends_on:
      sqlserver-init:
        condition: service_completed_successfully
    environment:
      DB_URL: jdbc:sqlserver://sqlserver:1433;databaseName=cidadao_ativo;encrypt=true;trustServerCertificate=true
      DB_USER: sa
      DB_PASSWORD: ${MSSQL_SA_PASSWORD:?Configure a senha no .env}
      PORT: "8080"
    ports:
      - "8080:8080"
    restart: on-failure
volumes:
  sqlserver-data:
